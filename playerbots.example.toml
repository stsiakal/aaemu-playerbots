# playerbots.toml - configuration of the aaemu-playerbots binary.
#
#   playerbots example-config > playerbots.toml     (this file)
#   playerbots run --config playerbots.toml
#
# Every key is optional; the values below are the defaults. Unknown keys are an error.

[server]
# Public login port of the AAEmu Rust server (the port the client connects to).
login = "127.0.0.1:1237"
# Game server (world) id to enter. 0 = the first active world the login server lists.
world_id = 0
# Bot accounts are "<prefix><bot id>" (pb1, pb2, ...). The login server creates unknown
# accounts on first login (AutoAccount = true in its Config.json).
account_prefix = "pb"
# Password of every bot account. Empty = the environment variable PLAYERBOTS_PASSWORD, and if
# that is not set either, a random password generated on the first run and kept in
# roster.secrets.json next to the roster (owner-only; never in the web API or the logs). Keep that
# file together with the roster. A roster from before this feature has none: its accounts keep the
# old public default "playerbots" (with a warning), which gm_bootstrap refuses.
password = ""

[data]
# The server's compact.sqlite3 (opened read-only).
compact = "compact.sqlite3"
# The server's app/Data directory (Worlds/<world>/*.json, CharTemplates.json).
server_data = "Data"
# Output directory of `playerbots bake` (terrain heights, world map, housing areas, quest spheres,
# zones). Without it bots walk on flat terrain and the web map has no picture.
# baked = "baked"
world = "main_world"

# Typical paths with the AAEmu server checked out on the same machine (uncomment and adapt; forward
# slashes work on Windows too):
#   compact     = "<AAEmu>/rust/crates/aaemu-game/app/Data/compact.sqlite3"
#   server_data = "<AAEmu>/rust/crates/aaemu-game/app/Data"
#   baked       = "<data dir>"

[bots]
# Bots started at launch. More can be started and stopped from the web UI.
count = 10
# Delay between two bot logins.
ramp_ms = 750
# The persistent roster: accounts, character names, classes and personas of all bots.
# Created on the first run; keep it, it ties the bots to their characters.
roster = "roster.json"
# The bots' journal: what each bot remembers between runs (places it has seen, wild plots, its play
# sessions, notes). Empty = journal.json next to the roster. Keep it with the roster.
journal = ""
# Races for new characters: nuian, elf, hariharan, ferre (the ones 1.2 lets a player create).
races = ["nuian", "elf", "hariharan", "ferre"]
# Let bots use GM chat commands (/item add, /gold add, /labor, /move) to get what trade runs and
# housing need. Requires access level 100 on the bot accounts: `playerbots grant-gm-sql`.
gm_bootstrap = false
# Brain tick while a bot moves or fights, and while it stands still (milliseconds).
tick_ms = 250
idle_tick_ms = 1500
# Milliseconds between two movement updates of a walking bot that a real player can see (the
# 1.2 client sends about seven a second, the server's NPCs ten). Between brain ticks the bot only
# moves on and sends the update. 50 to tick_ms; a bot nobody can see sends one a second.
move_update_ms = 125
# Run and walk speed in metres per second.
move_speed = 5.4
walk_speed = 1.8
# With gm_bootstrap, trips longer than this many metres use /move instead of walking. 0 = never.
long_travel_teleport_m = 0
# Wait after a failed connection (doubles up to the maximum), in seconds.
reconnect_min_secs = 5
reconnect_max_secs = 120

[behavior]
# Relative weights of the goals; 0 switches a goal off. Each bot also has a persona that scales
# them (some bots like quests, some duels, some trading).
quest = 1.0
grind = 1.0
duel = 0.3
trade = 0.2
trade_run = 0.3
housing = 0.2
rest = 0.4
wander = 0.5
# 0 = every bot has the same temperament, 1 = the full spread stored in the roster.
persona_spread = 0.6
# Let bots trade with real players too. Off: a bot only trades with other bots and declines every
# trade request of a character that is not one of ours, so nobody can farm the goods and gold the
# bots mint for themselves (gm_bootstrap).
trade_with_players = false
# Travel. Bots may use portals (teleport book, recall points, gates).
portals = true
# Bots may form parties and enter instance dungeons (goal "dungeon").
dungeons = true
# A bot below the level range of a dungeon may raise its level to the minimum with the GM /level
# command (needs gm_bootstrap; logged). Off: only bots whose level fits run a dungeon.
dungeon_level_up = false
# Bots may summon boats and sail (goal "sail").
sailing = true
# Bots walk routes on the navigation mesh (nav_<world>.bin in the baked data): around walls and
# water, along roads, with rounded corners. false = straight lines, as before the mesh existed.
navmesh = true
# Life-like movement: bots jump now and then, use emotes and shift about while they stand.
lifelike = true
# How often they jump, as a multiplier of the usual rate (0 = never).
jump_rate = 1.0
# Emotes (a wave, a bow, a sit) in life-like moments.
emotes = true

[dungeons]
# Count the server's entry limit (three entries per zone group and four hours) and skip a dungeon
# whose entries are used up. Off by default: the 1.2 server has no dungeon entry limit
# (Dungeons.EntryLimit). A refusal for the limit is answered either way.
entry_limit = false
# A wish waits this many seconds for a full party (the dungeon's max_players, at most five) before
# it goes with a smaller one (four bots start after 90 s of rallying, see the party planner). At
# most 600.
relax_after_secs = 600

[survival]
# Fewer deaths: when a bot may pull, when it runs and how it rests after a resurrection. The
# defaults come from the 2026-11-11 death journal (1,407 deaths in 9.6 h, about three per
# bot-hour while logged in). false = the old engagement, resting and travel behaviour; the death
# line (killer, level gap, attackers, HP/MP, goal, zone, fleeing) is logged either way.
enabled = true
# A bot does not start a new fight below this many percent of hit points or mana.
pull_min_hp_pct = 60
pull_min_mp_pct = 20
# Below this many percent of hit points a goal ends and the bot rests.
rest_hp_pct = 50
# Monsters this many levels above the bot are not pulled (1.2 quests routinely send a player at
# monsters 2-3 levels above it). max_grade is the strongest NpcGradeType pulled: "normal" (Normal
# and Weak), "elite" (also Elite and Strong) or "boss" (everything, bosses included). Bosses are
# refused solo and allowed from party_boss_min members in range on. A target with more than
# max_pack monsters within pack_radius_m that would aggro with it (aggressive, linked by
# npc_aggro_links or already on the bot; passive bystanders do not count) is not pulled; a party
# may pull max_pack per member in range. Quest kill objectives obey the same rules.
max_level_gap = 3
max_grade = "elite"
max_pack = 2
pack_radius_m = 8.0
party_range_m = 40.0
party_boss_min = 2
# A monster fight is given up and the bot runs below this many percent of hit points, or with at
# least flee_adds attackers while below flee_adds_hp_pct (0 = never run).
flee_hp_pct = 40
flee_adds = 3
flee_adds_hp_pct = 60
# After a resurrection the bot rests until this many percent of hit points, for at most
# post_rez_rest_ms (milliseconds), before it takes the next goal. A rest that starts next to a
# hostile monster first walks rest_safe_spot_m away from one within rest_hostile_m, and casts a
# heal the rotation has (the Cleric's antithesis) below heal_hp_pct.
post_rez_hp_pct = 75
post_rez_rest_ms = 120000
rest_safe_spot_m = 40.0
rest_hostile_m = 20.0
heal_hp_pct = 60
# While travelling, a bot takes one waypoint around an aggressive monster more than
# travel_danger_gap levels above it whose travel_aggro_m radius the straight line crosses, up to
# travel_lookahead_m ahead.
travel_danger_gap = 4
travel_aggro_m = 15.0
travel_lookahead_m = 60.0

[sail]
# The boat the sailing goal uses: "rowboat" (default), "clipper", "cutter", "junk", "yawl",
# "schooner" or "auto" (the boat whose scroll the bot holds, else a boat of its own). Needs
# gm_bootstrap or the scroll in the bag. The bigger boats need more room: a cutter is launched
# from a beach with deep water, sails wide of the coast and berths out at sea.
ship = "rowboat"

[mounts]
# Mounts and gliders: a bot summons the rideable mate of a summon item it owns for a long
# overland trip, rides it, dismounts for a fight, a talk, a harvest or a dungeon door, and
# dismisses it after standing idle. It also wears a glider on its back and glides down a ledge
# when the way ahead falls away. With bots.gm_bootstrap a bot grants itself the cheapest rideable
# mount / glider of its level when its bag holds none.
enabled = true
# Bots summon and ride mounts.
mounts = true
# Bots equip a glider and glide down a ledge on their way.
gliders = true
# The shortest trip a mount is summoned for, in metres.
summon_over_m = 250.0
# A mounted bot dismounts when the rest of the trip is this short, in metres.
dismount_under_m = 40.0
# Mounted run speed in m/s.
speed = 10.0
# The mount summon item template; 0 = the lowest-id rideable mount of the bot's level from the
# game data (4177, the Lilyut horse, in the 1.2 data).
item = 0
# The glider item template; 0 = the lowest-id glider of the bot's level from the game data
# (16385, Tooloop's old glider, in the 1.2 data).
glider_item = 0
# Dismiss the standing mate after this many seconds without a trip; 0 keeps it.
idle_despawn_secs = 120
# A drop at least this deep (metres) under the way ahead may be glided down ...
glide_drop_m = 8.0
# ... looking this far ahead (metres).
glide_lookahead_m = 30.0
# Glide horizontal speed and descent, in m/s.
glide_speed = 9.0
glide_descent = 3.0

[market]
# Selling what the bots gather: auction listings, trade-chat advertisements and sales to players.
# Only goods the bots came by honestly are sold (looted, gathered, crafted, quest rewards, bought
# from a vendor), never GM-made ones. false = no bot lists, advertises or sells anything.
enabled = true
# Bots list surplus goods at the auction house (goal "auction").
auction = true
# Bots advertise surplus goods in trade chat (goal "market").
chat_ads = true
# Bots sell advertised goods to real players in a trade. Off by default, and ignored while
# bots.gm_bootstrap is on: what a GM-bootstrapped bot holds may be minted.
sell_to_players = false
# Where a bot meets a buyer: "auto" (Mirage Isle if it can get there, else the town it is in),
# "mirage" or "town".
meet_at = "auto"
# All bots together post at most this many advertisements per hour (0 = none) ...
max_ads_per_hour = 12
# ... and one bot posts one at most this often, in seconds (at least 60).
ad_interval_secs = 900

[guild]
# Bots in guilds (expeditions): found one together, join one, keep one running (goal "guild").
# Off until enabled.
enabled = false
# Bots may found guilds. false = they only join existing ones.
found = true
# A bot founds or joins a guild from this level on.
min_level = 5
# Bots that found a guild together (1 to 50).
party_size = 5
# This process founds at most this many guilds (0 = none).
max_guilds = 3
# Bots accept the guild invitations of real players.
accept_player_invites = false
# How many times an hour a bot that has been in a bot guild for a quarter of an hour leaves it, on
# average (0 = never). An owner hands the guild to another bot first; the bot can be invited again
# after a while.
churn_per_hour = 0.2

[pvp]
# Player versus player: defending, fights between bots, ganks and warzones. Off until enabled.
# Attacking real players is a switch of its own (attack_players) and never happens while
# bots.gm_bootstrap is on: what a GM-bootstrapped bot holds may be minted.
enabled = false
# A bot fights back when a player attacks it.
defend = true
# Bots of hostile factions attack each other.
attack_bots = false
# Bots attack real players (characters that are not ours).
attack_players = false
# Bots ambush trade-pack carriers (goal "gank").
gank = false
# Bots fight in zones at war (goal "warzone").
warzone = false
# Character names that are never attacked (game masters, friends).
never_names = []
# When not empty: the only real players that may be attacked.
only_names = []
# Most bots that attack together (1 to 50).
max_squad = 3
# A bot below this many percent of its hit points breaks off a fight (0 to 100).
retreat_hp_pct = 35
# Most characters one bot kills in one war of a zone group before it leaves the war (1 to 100).
war_kill_cap = 10

[events]
# Bots at world events such as rifts (goal "event"). Off until enabled.
enabled = false
# At most this many bots join one event ...
max_bots_per_event = 6
# ... and at most this share (0 to 1) of the online bots that are high enough for the event takes
# part in events at once.
max_share = 0.25
# A bot waits a random number of seconds in this range [low, high] before it joins.
join_delay_secs = [10, 120]
# With "enabled": the quest, grind and wander goals choose no destination in a zone group at war and
# bots do not join an event there. (The server's rifts usually run in a zone group that is at war part
# of the time: set this to false to let the bots help then too.)
avoid_war_zones = true

[party]
# Bots and the parties of real players. All off by default.
# Bots join the parties of real players when invited (goal "companion").
join_player_parties = false
# Bots obey party chat commands of the player who leads the party.
chat_commands = false
# A bot in a player's party follows it into instance dungeons.
follow_into_dungeons = false
# A bot declines the invitation of a player whose level (when known) is more than this far from its own.
max_level_gap = 10
# This process has at most this many bots in the parties of real players (more are declined) ...
max_companions = 8
# ... and at most this many of them in one player's party (a party holds five).
max_per_player = 4

[population]
# The population director of the web UI: starts and stops bots to follow the players. Off until
# enabled.
enabled = false
# The director only logs what it would do.
dry_run = true
# It starts at most this many bots per minute (0 = none) ...
max_spawn_per_min = 10
# ... and waits at least this many seconds between two of its actions (at least 1).
min_action_gap_secs = 60
# The start values of the policy that the web UI's Director tab edits live.
# Bots online, all together, that the director will not exceed when it starts more.
max_online = 50
# Each side (Nuia, Haranya) keeps at least this many bots.
min_per_side = 0
# A side aims for this many characters (players plus bots) per 100 players on the other side.
mirror_pct = 100
# No side gets more bots than this from the director.
per_side_cap = 20
# The most bots one action starts or stops.
step = 3
# Bots above the target that a side keeps before the director stops some it started.
hysteresis = 2
# The director may stop the bots it started.
despawn = true
# It stops starting bots above this much process memory (MB) ...
backoff_rss_mb = 3072
# ... above this many packets per second from the server ...
backoff_packets_in = 30000
# ... after this many failed or short sessions within five minutes ...
backoff_login_failures = 8
# ... with this many open server issues. 0 ignores a limit.
backoff_open_issues = 50
# Keeps the numbers, wishes and goal weights between runs (a path; unset = in memory only). The kill
# switch and dry_run always start as written here, whatever the last run ended with.
# policy_file = "population.policy.json"
# The game server's web API, for the exact number of players online, the server status and the
# auction house's lots. Empty = not used. The key is read from the environment variable named
# below (or from the first line of server_api_key_file); it is never logged or shown.
server_api = ""
server_api_key_env = ""
# server_api_key_file = "server-api.key"
# Seconds between two polls of the API (at least 5).
server_poll_secs = 30

[farm]
# Bots plant and harvest crops (goal "farm"). Off until enabled.
enabled = false
# One bot tends at most this many plots (the server allows 10 on a public field farm, 5 on the
# other kinds).
max_plots = 5
# The game server's World.GrowthRate (crops grow this many times faster than the default 1.0). It is
# not on the wire, so say it here when the server changed it; ripe times are planned with it.
growth_rate = 1.0
# Plant on the public farms (needs farm_areas.json in the baked data: re-run `playerbots bake`).
public_farms = true
# Plant on the land of the bot's own houses.
own_land = true
# Plant the seeds a harvest gives back on the spot the crop stood.
replant = true
# The farthest a bot walks to a farm, a vendor or a plot, in metres. With bots.gm_bootstrap and
# bots.long_travel_teleport_m a longer trip is a GM /move.
max_trip_m = 4000.0
# Bots with a shady streak also plant "illegal" farms: crops on unprotected land out in the wild,
# away from roads, towns and people. Planting there costs labor (the seed's use skill, usually 1 or
# 10 points) and nothing protects such a crop: anybody may take it. The plots are kept in the
# journal (no server packet lists them); a crop that is gone when the bot comes back was stolen,
# and the bot plants its next patch elsewhere.
wild = false
# One bot keeps at most this many wild plots (part of max_plots) ...
wild_plots = 3
# ... and plants them of its own accord from this outlaw trait (0 to 1) on.
wild_outlaw = 0.6
# Outlaw bots harvest ripe wild crops that are not theirs: only the crops of this process's other
# bots, unless steal_from_players. The server lets anybody harvest a crop in the wild; for a day
# after the planting the thief leaves footprints (crime evidence a player can report).
steal = false
# With steal: real players' crops too. Never while bots.gm_bootstrap is on.
steal_from_players = false

[gear]
# Bots put on the best gear they have for their level, socket gems and tier up as they progress
# (goal "gear"). The equip duty compares the bag with what the bot wears every check_secs and puts
# on the better piece (item level, grade, gems and how well it suits the class build; never above
# the bot's level requirement); quest rewards are picked the same way.
enabled = true
# The goal buys better pieces from merchants (copper only).
buy = true
# The goal mints the pieces and lunagems of the bot's tier with GM commands (needs
# bots.gm_bootstrap).
mint = true
# The goal sockets lunagems into free sockets: always when the chance is 100 %, a riskier gem only
# for bots with much gearhead (a failed socketing takes every gem of the piece out).
socket = true
# The goal regrades worn pieces with scrolls (needs bots.gm_bootstrap). Only grades a failure cannot
# destroy; still a gamble, so off by default.
regrade = false
# The most a purchase may cost, in percent of the bot's money (1-100).
max_spend_pct = 30
# Seconds between two looks of the equip duty at the bag (1-3600).
check_secs = 20
# The farthest a bot goes to a merchant, in metres.
max_trip_m = 3000.0

[personality]
# Every bot has a personality beside its temperament: how chatty, crude and funny it is, whether it
# explores, does shady things or obsesses over gear, and when and how long it plays. Stored in the
# roster. Off: every bot behaves like the neutral profile, and its chat stays clean.
#
# In chat a chatty bot answers more of what it overhears, says more unasked and waits less between
# lines (a quiet one hardly speaks); a jokey one tells ArcheAge jokes (labor, gankers, regrades,
# the queue, lag ...); a crude one swears now and then, within the cap below. All of it stays
# inside the process-wide rates ([social] replies_per_min and chatter_per_min, and the two below)
# and the per-bot limits (at most 1 to 5 unasked lines in 10 minutes, by chattiness).
enabled = true
# The coarsest language any bot may use in chat: "off" (none), "mild" (damn, hell, crap, wtf, ffs)
# or "strong" (harsher exclamations too). Only ever an exclamation about the game, never aimed at
# a player; slurs, hate, sexual words, insults and threats are refused at every level. The cap
# filters every line, canned or written by the LLM: a word above it is softened ("damn" becomes
# "dang") or the line is not sent.
profanity = "mild"
# With [llm] enabled, the model may write some of the ambient lines too (at most 2 a minute for
# all bots together; the canned line is the fallback). Without [llm] it does nothing.
llm_chatter = true
# All bots together say at most this many ambient lines per minute: remarks and jokes in local
# chat while a real player is near (0 = none; at most 60). A chatterbox says one every few
# minutes, a quiet bot hardly ever.
ambient_per_min = 2
# All bots together say at most this many lines per hour on the shout, trade and group-finding
# channels (0 = none; at most 120). Only the chattier bots use them, and never to advertise.
channel_lines_per_hour = 4

[presence]
# Bots log in and out on schedules of their own, so the population rises and falls like a real
# server's: when in the day a bot plays follows its chronotype (early bird, daytime, evening, night
# owl), how long and how often its dedication (a casual plays 20 to 60 minutes and skips days, a
# no-lifer plays for hours with breaks). On: nobody is started at launch, bots.count only sizes the
# roster and the schedules log the bots in through the ramp. Bots you start by hand are never
# logged out by the schedules; a bot you stop by hand stays offline until its schedule ends that
# session; the population director's bots are its own. Off: every bot stays online.
enabled = false
# Bots online at least, all together (sessions are brought forward to keep it) ...
min_online = 0
# ... and at most (0 = no limit but the roster). Every bot online counts, whoever started it.
max_online = 0
# The schedules log in at most this many bots per minute ...
max_starts_per_min = 20
# ... and log out at most this many. A bot is only logged out when that is safe (not in a trade, a
# duel, a dungeon, a market meeting, on a boat or in the party of a real player).
max_stops_per_min = 3
# Chance (0 to 1) that a bot says a short goodbye before it logs out (only with [social] enabled).
goodbye_chance = 0.1
# The schedules go by the machine's local time; set this to use UTC plus so many hours instead.
# utc_offset_hours = 1.0

[explore]
# Bots go and see places they have not been (goal "explore"): zones they never stood in, the
# recall points, hills with a view and the coast of the zones they know. What they saw is kept in
# the journal.
enabled = true
# The farthest an exploring trip goes, in metres (portals and the GM /move work as for any trip).
max_trip_m = 6000.0
# A destination with monsters this many levels above the bot is left out.
level_gap = 5
# Minutes a bot of average curiosity waits between two trips (an explorer at heart half as long).
trip_gap_mins = 45

[web]
# Operator UI and JSON API. Keep it on loopback unless you set a token.
bind = "127.0.0.1:8790"
# With a token, POST requests need the header "x-playerbots-token: <token>".
# token = "change-me"

[social]
# How the bots talk. Works without the LLM: replies then come from a table of short, persona-flavoured
# lines. Whispers are answered with a whisper, local chat with a local line. A line that starts with
# "/" is never sent (the server would run it as a GM command).
enabled = true
# A local line from a real player (not one of our bots) within this many metres may get an answer;
# a line that names the bot, and every whisper, always may.
reply_radius_m = 30.0
# Chance that a bot answers a local line that does not name it. Of all the bots that hear such a
# line only the first to claim it answers.
reply_chance = 0.4
# All bots together answer at most this many lines per minute (0 = none). Each bot also waits at
# least ~8 s between replies, answers at most 4 times in 2 minutes and 6 times per player in 10.
replies_per_min = 20
# Bots greet each other: "gg" after a duel, thanks after a trade, a hello to a bot nearby.
bot_chatter = true
# ... but only while a real player is within 150 m, so nobody talks to an empty street.
chatter_needs_player = true
# All bots together say at most this many chatter lines per minute (0 = none) ...
chatter_per_min = 4
# ... and one bot says one at most this often (seconds).
chatter_gap_secs = 60
# Testing only: also answer the whispers and local lines of our own bots.
reply_to_bots = false

[llm]
# Optional chat / decision add-on for any OpenAI-compatible endpoint. Off by default; the bots
# work the same without it. The key is read from the environment variable named below, never from
# this file:   export DEEPSEEK_API_KEY=sk-...   (PowerShell: $env:DEEPSEEK_API_KEY = "sk-...")
#
# With it on, bots answer players with a line the model writes in character (the canned table
# stays as the fallback) and, with `director = true`, the model sometimes picks a bot's next goal.
# Costs are bounded: at most `max_requests_per_minute` requests per minute and `daily_token_budget`
# tokens per UTC day for all bots together; when either is used up the bots fall back to canned
# lines and their own scoring. Replies are filtered before they are sent (no commands, links,
# "I am an AI"; at most 120 characters).
enabled = false
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
timeout_secs = 20
max_concurrent = 2
max_requests_per_minute = 30
# 0 = no daily limit (not recommended)
daily_token_budget = 200000
temperature = 0.8
max_reply_tokens = 80
# The director: every `director_interval_secs` (per bot, jittered by +-30 %) a bot asks the model
# what to do next. It is offered at most ten options: the goals it may pick right now (never one
# that is switched off, cooling down, or needs gm_bootstrap when that is off) and concrete
# variants of them it can do now ("explore <zone>" for a zone it has never been in that is not
# deadly for its level, "wander to the town of <zone>", "wander home", "farm wild" with
# [farm] wild and a shady streak). The answer is a short plan; each step starts when the goal
# before it ends, and only if it is still allowed. When a request fails the bot's own scoring
# decides. director_interval_secs: minimum 30.
director = false
director_interval_secs = 600
# Steps the model may plan ahead in one answer (1..=5).
director_plan_steps = 3
# Ask sooner than the interval after a level-up, a death, a failed goal, a zone the bot has never
# been in, or when the plan runs out.
director_triggers = true
# Never two director requests of one bot within this many seconds (also for the triggers;
# minimum 30).
director_min_gap_secs = 120
# The answer may carry a short note the bot keeps in its journal (filtered like a chat line); the
# model sees the last notes again as the bot's own memories.
director_notes = true

[issues]
# Server issue reports: while they play, the bots notice problems with the SERVER (a quest that
# gives no credit, an NPC that is not there, a kick, a character that dies without the server
# saying so, a warning in the server's log). They are collected, deduplicated by what went wrong
# (the same problem met by many bots is one issue) and shown through the web API. An issue that is
# worth the team's time is written to an evidence folder and, if you set a queue file, appended to
# it as an entry for the agents who work from that file. Nothing here ever contains a password,
# and IPv4 addresses (other than 127.x) are replaced by x.x.x.x in everything written.
enabled = true
# Where the book of issues (issues.json) is kept, so that deduplication and the rate limits
# survive a restart. Default: a directory "issues" next to bots.roster.
# dir = "issues"
# One folder per reported issue: report.json, trail.txt (the packets before it), server-log.txt
# and bot-log.txt. Default: "<dir>/evidence". Delete old folders whenever you like.
# evidence_dir = "issues/evidence"
# The team's issue queue: a text file (CRLF line breaks) that entries are APPENDED to, one entry
# per issue: a header line "[YYYY-MM-DD HH:MM:SS <time_label>] <title> (playerbots)" and a few
# lines of prose, with one blank line between entries. The file is never rewritten or truncated;
# it is created if it does not exist. Agents delete an entry when its fix is done; when the issue
# happens again 30 minutes or more after it was queued and its entry is gone, a "Recurrence ..."
# entry is appended. Unset = no queue file (issues stay in the book and the web UI).
# queue_file = '<path>/issues.txt'
# "auto": reportable issues are appended by a background task within the limits below.
# "manual": only the web UI / API action "queue" appends an entry.
# "off": the queue file is never touched.
queue_mode = "auto"
# The label after the time in an entry's header, e.g. "EST". Default: the machine's UTC offset,
# e.g. "UTC-05:00".
# time_label = "EST"
# The game server's log file (lines like "HH:MM:SS [LEVEL] target - message"), when the bots run on
# the machine that writes it. It is followed (new lines only, rotation and truncation are noticed)
# to attach the server's warnings and errors around a problem to the report, and a bot is told
# when the server logs a warning or an error that names its character.
# server_log = '<path>/game-server.log'
# An issue the team should hear about: not suspected to be the bots' own mistake, and seen this
# many times or by this many different bots. (A few symptoms - a death the server never announced,
# a malformed packet, a kick, an ERROR in the server log about a bot - count after one sighting.)
min_occurrences = 3
min_bots = 2
# Rate limits of queue entries: this many per hour for all issues together ...
max_queue_per_hour = 6
# ... and this many NEW entries per kind of issue in 24 hours. The rest wait; they stay visible in
# the web UI.
max_queue_per_kind_per_day = 2
